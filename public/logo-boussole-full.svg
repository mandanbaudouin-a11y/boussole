<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Boussole</title>
  <desc>Logo Boussole — étoile de boussole à quatre pointes teal et menthe, avec le nom en typographie serif.</desc>

  <circle cx="120" cy="130" r="92" fill="#F7FAFA" stroke="#028090" stroke-width="2.5"/>
  <circle cx="120" cy="130" r="70" fill="none" stroke="#028090" stroke-width="0.75" opacity="0.35"/>

  <g transform="translate(120,130)">
    <polygon points="0,-64 10,0 0,10 -10,0" fill="#028090"/>
    <polygon points="64,0 0,10 -10,0 0,-10" fill="#02C39A"/>
    <polygon points="0,64 -10,0 0,-10 10,0" fill="#028090"/>
    <polygon points="-64,0 0,-10 10,0 0,10" fill="#02C39A"/>
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" stroke="#028090" stroke-width="2"/>
  </g>

  <text x="248" y="122" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="52" fill="#1F2937">Boussole</text>
  <text x="250" y="152" font-family="Arial, sans-serif" font-weight="400" font-size="18" fill="#6B7280">Gestion des plans d&#8217;enseignement individualis&#233;</text>
</svg>
