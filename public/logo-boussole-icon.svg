<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Boussole — icône</title>
  <desc>Icône carrée du logo Boussole : étoile de boussole à quatre pointes teal et menthe, sur fond blanc arrondi.</desc>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="#F7FAFA"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#028090" stroke-width="6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#028090" stroke-width="1.5" opacity="0.35"/>

  <g transform="translate(256,256)">
    <polygon points="0,-146 22,0 0,22 -22,0" fill="#028090"/>
    <polygon points="146,0 0,22 -22,0 0,-22" fill="#02C39A"/>
    <polygon points="0,146 -22,0 0,-22 22,0" fill="#028090"/>
    <polygon points="-146,0 0,-22 22,0 0,22" fill="#02C39A"/>
    <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#028090" stroke-width="4"/>
  </g>
</svg>
